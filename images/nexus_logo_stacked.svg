<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0077cc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#e8a020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="300" height="320" fill="url(#bgGrad)" rx="16"/>

  <!-- Icon centered top -->
  <!-- Connection lines -->
  <line x1="150" y1="110" x2="150" y2="58" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="150" y1="110" x2="107" y2="153" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="150" y1="110" x2="193" y2="153" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="150" y1="110" x2="100" y2="110" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="150" y1="110" x2="200" y2="110" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="150" y1="110" x2="193" y2="67" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="150" y1="58" x2="193" y2="67" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="193" y1="67" x2="200" y2="110" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="200" y1="110" x2="193" y2="153" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="107" y1="153" x2="100" y2="110" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="100" y1="110" x2="150" y2="58" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Satellite nodes -->
  <circle cx="150" cy="54" r="6" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="195" cy="65" r="5" fill="#e8a020" filter="url(#glow)"/>
  <circle cx="204" cy="110" r="6" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="195" cy="155" r="5" fill="#e8a020" filter="url(#glow)"/>
  <circle cx="105" cy="155" r="5" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="96" cy="110" r="6" fill="#e8a020" filter="url(#glow)"/>

  <!-- Center hub -->
  <circle cx="150" cy="110" r="13" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
  <circle cx="150" cy="110" r="7" fill="#ffffff"/>

  <!-- Wordmark stacked -->
  <text x="150" y="198"
    font-family="'Courier New', monospace"
    font-size="32" font-weight="700" letter-spacing="5"
    fill="#ffffff" text-anchor="middle" filter="url(#glow)">NEXUS</text>

  <rect x="40" y="206" width="220" height="2" fill="url(#accentGrad)" rx="1"/>

  <text x="150" y="228"
    font-family="'Courier New', monospace"
    font-size="10" font-weight="400" letter-spacing="5"
    fill="#00d4ff" text-anchor="middle">DIGITAL SOLUTIONS</text>

  <text x="150" y="264"
    font-family="'Courier New', monospace"
    font-size="7.5" font-weight="300" letter-spacing="2"
    fill="#e8a020" text-anchor="middle" opacity="0.85">CONNECTING THE DOTS.</text>

  <text x="150" y="279"
    font-family="'Courier New', monospace"
    font-size="7.5" font-weight="300" letter-spacing="2"
    fill="#e8a020" text-anchor="middle" opacity="0.85">BUILDING THE FUTURE.</text>

  <!-- Corner brackets -->
  <path d="M 14 14 L 14 26 M 14 14 L 26 14" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 286 14 L 286 26 M 286 14 L 274 14" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 14 306 L 14 294 M 14 306 L 26 306" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 286 306 L 286 294 M 286 306 L 274 306" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
</svg>
