<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0077cc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#e8a020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bgGrad)" rx="36"/>

  <!-- Connection lines -->
  <line x1="100" y1="100" x2="100" y2="38" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="100" x2="47" y2="153" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="100" x2="153" y2="153" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="100" x2="38" y2="100" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="100" x2="162" y2="100" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="100" x2="153" y2="47" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Outer ring connections -->
  <line x1="100" y1="38" x2="153" y2="47" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="153" y1="47" x2="162" y2="100" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="162" y1="100" x2="153" y2="153" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="47" y1="153" x2="38" y2="100" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="38" y1="100" x2="100" y2="38" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Satellite nodes -->
  <circle cx="100" cy="36" r="7" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="155" cy="46" r="6" fill="#e8a020" filter="url(#glow)"/>
  <circle cx="164" cy="100" r="7" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="155" cy="154" r="6" fill="#e8a020" filter="url(#glow)"/>
  <circle cx="45" cy="154" r="6" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="36" cy="100" r="7" fill="#e8a020" filter="url(#glow)"/>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="16" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
  <circle cx="100" cy="100" r="9" fill="#ffffff"/>

  <!-- N lettermark in center -->
  <text x="100" y="105" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#0a0f1e" text-anchor="middle">N</text>
</svg>
