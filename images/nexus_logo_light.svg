<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005599;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8a020;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="600" height="200" fill="#ffffff" rx="12"/>
  <rect width="600" height="200" fill="#f8fafc" rx="12"/>

  <!-- Connection lines -->
  <line x1="100" y1="100" x2="100" y2="52" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="100" x2="62" y2="138" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="100" x2="138" y2="138" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="100" x2="55" y2="100" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="100" x2="145" y2="100" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="100" x2="138" y2="62" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="52" x2="138" y2="62" stroke="#0077cc" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="138" y1="62" x2="145" y2="100" stroke="#0077cc" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="145" y1="100" x2="138" y2="138" stroke="#0077cc" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="62" y1="138" x2="55" y2="100" stroke="#0077cc" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="55" y1="100" x2="100" y2="52" stroke="#0077cc" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Satellite nodes -->
  <circle cx="100" cy="48" r="5" fill="url(#nodeGrad)"/>
  <circle cx="140" cy="60" r="4" fill="#e8a020"/>
  <circle cx="148" cy="100" r="5" fill="url(#nodeGrad)"/>
  <circle cx="140" cy="140" r="4" fill="#e8a020"/>
  <circle cx="60" cy="140" r="4" fill="url(#nodeGrad)"/>
  <circle cx="52" cy="100" r="5" fill="#e8a020"/>

  <!-- Center node -->
  <circle cx="100" cy="100" r="10" fill="url(#nodeGrad)"/>
  <circle cx="100" cy="100" r="6" fill="#ffffff"/>

  <!-- Wordmark dark -->
  <text x="185" y="88"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="38"
    font-weight="700"
    letter-spacing="6"
    fill="#0a1628">NEXUS</text>

  <rect x="185" y="96" width="340" height="2" fill="url(#accentGrad)" rx="1"/>

  <text x="186" y="120"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="13"
    font-weight="400"
    letter-spacing="8"
    fill="#0077cc">DIGITAL SOLUTIONS</text>

  <text x="186" y="152"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="10.5"
    font-weight="400"
    letter-spacing="3"
    fill="#e8a020">CONNECTING THE DOTS. BUILDING THE FUTURE.</text>

  <!-- Corner brackets -->
  <path d="M 16 16 L 16 30 M 16 16 L 30 16" stroke="#0077cc" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M 584 16 L 584 30 M 584 16 L 570 16" stroke="#0077cc" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M 16 184 L 16 170 M 16 184 L 30 184" stroke="#0077cc" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M 584 184 L 584 170 M 584 184 L 570 184" stroke="#0077cc" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
</svg>
